[project]
name = "master-thesis"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Florian", email = "florian1230@live.at" }
]
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1.6",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
]

[project.scripts]
master-thesis = "master_thesis:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "tabulate>=0.10.0",
]

[tool.uv.build-backend]
module-name = ["master_thesis", "mdp_diagnostics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
